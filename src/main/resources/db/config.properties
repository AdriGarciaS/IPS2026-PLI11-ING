# Configuracion de la base de datos.
#
# bd.borrarAlCerrar:
#   false -> la base de datos se MANTIENE entre ejecuciones (data/demo.db).
#            Los datos de ejemplo solo se cargan la primera vez.
#   true  -> la base de datos se BORRA al cerrar la aplicacion, asi que cada
#            arranque empieza desde cero con schema.sql + data.sql.
#
# Se puede sobrescribir sin tocar este archivo al ejecutar:
#   java -Dbd.borrarAlCerrar=true -jar target/IPS2026-PL11-ING.jar
bd.borrarAlCerrar=false
