# Configuracion de la base de datos SOLO para los tests (esta carpeta va
# antes que src/main/resources en el classpath de los tests).
#
# bd.ruta: los tests usan target/test.db, asi que NUNCA tocan data/demo.db,
#   que es la base de datos de la aplicacion y se mantiene entre ejecuciones.
#   (Los tests que usan TestDatabase crean ademas su propia base de datos
#   temporal.)
# bd.borrarAlCerrar: la base de datos de los tests empieza siempre de cero.
bd.ruta=target/test.db
bd.borrarAlCerrar=true
